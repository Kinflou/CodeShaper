[package]
name = "codeshaper-core"
version = "0.1.0"
edition = "2021"


[dependencies]
glob = "0.3.0"
serde = { version = "1.0.151", features = ["derive"] }
json5 = "0.4.1"
knuffel = "3.2.0"
miette = { version= "5.9.0", features=["fancy"] }
pest = "2.5.0"
pest_derive = "2.5.0"
regex = "1.9.5"
regex-automata = "0.4.9"
bimap = "0.6.3"
indextree = "4.6.0"
enum_dispatch = "0.3.12"


[dev-dependencies]
pretty_assertions = "1.4.0"
