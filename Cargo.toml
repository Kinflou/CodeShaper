[workspace]
resolver = "2"
members = [
    "cli",
    "codeshaper-rs",
    "tool-ui",
    "core",
    "plugins/nav-ast-pest",
    "plugins/nav-ast-treesitter",
    "plugins/target-godot",
    "plugins/target-text"
]

[workspace.dependencies]
codeshaper = { path="codeshaper-rs/" }
codeshaper-core = { path="core/" }
codeshaper-nav-ast-treesitter = { path="plugins/nav-ast-treesitter/", default-features=false }
codeshaper-target-godot = { path="plugins/target-godot/" }
codeshaper-target-text = { path="plugins/target-text/" }
knus = "3.4.1"
miette = "7.6.0"
tempfile = "3.10.1"

[profile.release]
opt-level = 2
