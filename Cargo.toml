[workspace]
resolver = "2"
exclude = ["analysis"]
members = [
    "codeshaper-rs",
    "tool-ui",
    "core",
    "plugins/nav-ast-pest",
    "plugins/nav-ast-treesitter",
    "plugins/target-text"
]

[workspace.dependencies]
codeshaper-core = { path="core/" }
codeshaper-nav-ast-treesitter = { path="plugins/nav-ast-treesitter/" }
codeshaper-target-text = { path="plugins/target-text/" }

[profile.release]
opt-level = 2
